{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>智能助手（普通问答 / 智能体模式）</h3>
  <div class="toolbar" style="margin-bottom:10px;">
    <select id="mode" style="width:150px;" onchange="toggleDraft()">
      <option value="qa">普通问答（RAG）</option>
      <option value="agent">智能体模式（Harness 执行循环）</option>
    </select>
    <span class="muted">智能体模式：填草稿参数可触发"预订流程"；创建草稿前会强制中断，等待你确认</span>
  </div>
  <div id="draftPanel" style="display:none;background:#f9fafb;border:1px dashed #d1d5db;border-radius:8px;padding:12px;">
    <p class="muted" style="margin-bottom:6px;">草稿参数（创建草稿技能仅协调员/管理员可用；草稿不生效，需人工复核）：</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
      <div><label>项目名称</label><input id="d_project" value="智能仓储对接会"></div>
      <div><label>主办单位</label><input id="d_organizer" value="华辰会展"></div>
      <div><label>场地</label><input id="d_venue" placeholder="主馆 Hall-A / 副馆 Hall-B"></div>
      <div><label>装卸口</label><input id="d_dock" placeholder="A-E"></div>
      <div><label>活动开始</label><input id="d_es" placeholder="2026-12-20 09:00"></div>
      <div><label>活动结束</label><input id="d_ee" placeholder="2026-12-20 16:00"></div>
      <div><label>进场开始</label><input id="d_li" placeholder="2026-12-20 06:00"></div>
      <div><label>撤场结束</label><input id="d_lo" placeholder="2026-12-20 18:00"></div>
    </div>
  </div>
  <div id="chatBox" class="chat-box" style="margin-top:12px;"></div>
  <div style="display:flex;gap:10px;margin-top:14px;">
    <input id="question" placeholder="例如：装卸口占用的判定口径是什么？" onkeydown="if(event.key==='Enter')send()">
    <button class="btn btn-primary" onclick="send()">发送</button>
  </div>
</div>
<script>
let sessionId = null;

function toggleDraft() {
  document.getElementById('draftPanel').style.display =
    document.getElementById('mode').value === 'agent' ? 'block' : 'none';
}
function collectDraft() {
  const g = id => document.getElementById(id).value.trim();
  const d = { project_name: g('d_project'), organizer: g('d_organizer'), venue: g('d_venue'),
    event_start: g('d_es'), event_end: g('d_ee'), dock_no: g('d_dock'),
    load_in_start: g('d_li'), load_out_end: g('d_lo') };
  return Object.values(d).some(v => v) ? d : null;
}
function badge(status) {
  if (status === 'ok') return '<span class="badge badge-ready">通过</span>';
  if (status === 'denied') return '<span class="badge badge-risk">拒绝</span>';
  if (status === 'blocked') return '<span class="badge badge-processing">阻断</span>';
  if (status === 'pending_confirm') return '<span class="badge badge-processing">等待确认</span>';
  if (status === 'rejected') return '<span class="badge badge-risk">已取消</span>';
  return `<span class="badge badge-processing">${esc(status)}</span>`;
}

// 草稿确认卡片：中断瞬间推送给员工，确认后才会执行 create_schedule_draft
function draftCard(cid, draft) {
  const rows = Object.entries(draft).filter(([, v]) => v)
    .map(([k, v]) => `<tr><td class="muted" style="width:120px;">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  return `<div class="msg" id="confirm-${cid}">
    <div class="a" style="border-color:#f0c36d;background:#fffdf5;">
      <b>🛑 待确认：档期草稿内容（确认后才创建，草稿不生效）</b>
      <table style="width:100%;margin-top:8px;font-size:12px;">${rows}</table>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="decide(${cid},'confirm')">确认创建</button>
        <button class="btn" onclick="decide(${cid},'reject')">取消</button>
      </div>
    </div></div>`;
}

// 员工点击确认/取消 → 调恢复接口（服务端会重新校验缺项与冲突）
async function decide(cid, action) {
  const card = document.getElementById('confirm-' + cid);
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  card.insertAdjacentHTML('beforeend', '<div class="meta">处理中…</div>');
  try {
    const data = await api(`/api/agent/confirm/${cid}`, { method: 'POST', body: JSON.stringify({ action }) });
    card.querySelector('.meta')?.remove();
    card.insertAdjacentHTML('afterend', renderAnswer(data));
    if (data.draft_id) sessionId = sessionId; // 草稿已创建，可在"档期草稿"页查看
  } catch (e) {
    card.insertAdjacentHTML('afterend', `<div class="alert alert-error">${esc(e.message)}</div>`);
  }
}

function renderAnswer(data) {
  const steps = (data.trace || []).map(t =>
    `#${t.step} [第${t.round || '-'}轮] ${t.tool} ${badge(t.status)} ${t.duration_ms || 0}ms\n` +
    `入参: ${JSON.stringify(t.args)}\n结果: ${JSON.stringify(t.result)}`).join('\n\n');
  return `<div class="msg">
    <div class="a">${esc(data.answer)}</div>
    <div class="a" style="color:#a32d2d;border-color:#f7c1c1;">${esc(data.footer)}</div>
    <details><summary>工具调用轨迹（${(data.trace || []).length} 步，全量留痕）</summary><pre>${esc(steps)}</pre></details>
  </div>`;
}

// 智能体模式：POST + SSE 逐事件读取（轮次 → 工具 → 中断卡片 → 最终回答）
async function sendAgent(q) {
  const box = document.getElementById('chatBox');
  const resp = await fetch('/api/agent/run/stream', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q, session_id: sessionId, draft: collectDraft() })
  });
  if (resp.status === 401) { location.href = '/login'; return; }
  if (!resp.ok) throw new Error('请求失败 ' + resp.status);
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', live = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const line = part.trim();
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6);
      if (payload === '[DONE]') continue;
      const ev = JSON.parse(payload);
      if (ev.type === 'round') {
        live = live || box.appendChild(Object.assign(document.createElement('div'), { className: 'meta' }));
        live.textContent = `第 ${ev.round} 轮决策…`;
      } else if (ev.type === 'tool') {
        live = live || box.appendChild(Object.assign(document.createElement('div'), { className: 'meta' }));
        live.textContent = `第 ${ev.round} 轮 · ${ev.tool} · ${ev.status} · ${ev.duration_ms}ms`;
      } else if (ev.type === 'pending_confirmation') {
        live?.remove(); live = null;
        box.insertAdjacentHTML('beforeend', draftCard(ev.confirmation_id, ev.draft));
      } else if (ev.type === 'final') {
        live?.remove(); live = null;
        sessionId = ev.session_id;
        box.insertAdjacentHTML('beforeend', renderAnswer(ev));
      } else if (ev.type === 'error') {
        live?.remove();
        box.insertAdjacentHTML('beforeend', `<div class="alert alert-error">${esc(ev.detail)}</div>`);
      }
      box.scrollTop = box.scrollHeight;
    }
  }
}

async function send() {
  const input = document.getElementById('question');
  const mode = document.getElementById('mode').value;
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  const box = document.getElementById('chatBox');
  box.insertAdjacentHTML('beforeend',
    `<div class="msg"><span class="q">[${mode === 'agent' ? '智能体' : '问答'}] ${esc(q)}</span></div>`);
  box.scrollTop = box.scrollHeight;
  try {
    if (mode === 'agent') { await sendAgent(q); return; }
    const data = await api('/api/chat', { method: 'POST', body: JSON.stringify({ question: q, session_id: sessionId }) });
    sessionId = data.session_id;
    box.insertAdjacentHTML('beforeend', renderAnswer(data));
  } catch (e) {
    box.insertAdjacentHTML('beforeend', `<div class="alert alert-error">${esc(e.message)}</div>`);
  }
  box.scrollTop = box.scrollHeight;
}
</script>
{% endblock %}
