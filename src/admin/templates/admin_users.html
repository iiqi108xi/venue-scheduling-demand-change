{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>新增用户</h3>
  <div id="msg"></div>
  <div class="toolbar">
    <input id="nUser" placeholder="账号" style="width:150px;">
    <input id="nPass" placeholder="初始密码（≥6位）" style="width:170px;">
    <select id="nRole" style="width:150px;"><option value="employee">一线员工</option><option value="coordinator">项目协调员</option><option value="admin">管理员</option></select>
    <button class="btn btn-primary" onclick="createUser()">创建</button>
  </div>
</div>
<div class="card">
  <h3>用户列表</h3>
  <table id="tbl"><thead><tr><th>ID</th><th>账号</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody></tbody></table>
</div>
<script>
async function load() {
  const rows = await api('/api/admin/users');
  document.querySelector('#tbl tbody').innerHTML = rows.map(u => `<tr>
    <td>${u.id}</td><td>${esc(u.username)}</td>
    <td><span class="badge badge-${u.role}">${({admin:'管理员',coordinator:'协调员',employee:'一线员工'})[u.role] || u.role}</span></td>
    <td>${u.is_active ? '<span class="badge badge-ready">启用</span>' : '<span class="badge badge-failed">停用</span>'}</td>
    <td>${u.created_at}</td>
    <td class="toolbar">
      <button class="btn btn-sm" onclick="toggle(${u.id}, ${!u.is_active})">${u.is_active ? '停用' : '启用'}</button>
      <button class="btn btn-sm" onclick="resetPwd(${u.id})">重置密码</button>
    </td></tr>`).join('');
}
async function createUser() {
  const msg = document.getElementById('msg');
  try {
    await api('/api/admin/users', { method: 'POST', body: JSON.stringify({
      username: document.getElementById('nUser').value.trim(),
      password: document.getElementById('nPass').value,
      role: document.getElementById('nRole').value }) });
    msg.innerHTML = '<div class="alert alert-ok">创建成功</div>'; load();
  } catch (e) { msg.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`; }
}
async function toggle(id, active) {
  await api('/api/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ is_active: active }) });
  load();
}
async function resetPwd(id) {
  const p = prompt('输入新密码（≥6位）：');
  if (!p) return;
  try { await api('/api/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ new_password: p }) }); alert('已重置'); }
  catch (e) { alert(e.message); }
}
load();
</script>
{% endblock %}
